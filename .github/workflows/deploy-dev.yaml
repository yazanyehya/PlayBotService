name: Polybot Deploy Dev

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      DEV_EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      image:
        description: "Image tag to deploy"
        required: true
        type: string

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key

      - name: Deploy to EC2 via SSH
        run: |
          echo "✅ Deploying image: ${{ inputs.image }}"

          # Generate .env file
          echo "IMG_NAME=yazanyehya/${{ inputs.image }}" > .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TYPE_ENV=dev" >> .env

          # Send files to EC2
          scp -i ~/.ssh/private_key -o StrictHostKeyChecking=no .env docker-compose-dev.yaml otelcol-config.yaml ${{ secrets.EC2_USERNAME }}@${{ secrets.DEV_EC2_HOST }}:~/

          # SSH into EC2 and deploy
          ssh -i ~/.ssh/private_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USERNAME }}@${{ secrets.DEV_EC2_HOST }} '
            sudo apt-get update
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo \
                "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
                \$(. /etc/os-release && echo \${UBUNTU_CODENAME:-\$VERSION_CODENAME}) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi

            echo "✅ Starting Docker Compose services..."
            sudo docker compose -f docker-compose-dev.yaml pull
            sudo docker compose -f docker-compose-dev.yaml up -d
          '
