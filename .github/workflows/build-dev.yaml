name: Polybot Build Dev

on:
  push:
    branches:
      - dev

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-tag.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        run: docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set image tag
        id: set-tag
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/polybot-dev:${{ github.run_number }}"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ steps.set-tag.outputs.image }} .
          docker push ${{ steps.set-tag.outputs.image }}

  Deploy:
    needs: Build
    uses: yazanyehya/PlayBotService/.github/workflows/deploy-dev.yaml@dev
    with:
      image: ${{ needs.Build.outputs.image }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DEV_HOST: ${{ secrets.DEV_EC2_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}


