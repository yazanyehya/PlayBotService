name: Polybot Build Prod

on:
  push:
    branches:
      - main

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image-docker.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        id: build-image-docker
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

          IMAGE_TAG="polybot-prod:${{ github.run_number }}"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

          docker build --push -t yazanyehya/$IMAGE_TAG .

  Deploy:
    needs: Build
    uses: ./.github/workflows/deploy-prod.yaml
    with:
      image: ${{ needs.Build.outputs.image }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      TELEGRAM_BOT_TOKEN_PROD: ${{ secrets.TELEGRAM_BOT_TOKEN_PROD }}
      BOT_APP_URL_PROD: ${{ secrets.BOT_APP_URL_PROD }}
      AWS_S3_BUCKET_PROD: ${{ secrets.AWS_S3_BUCKET_PROD }}
      BOT_APP_CERT_PATH_PROD: ${{ secrets.BOT_APP_CERT_PATH_PROD }}
      YOLO_URL_PROD: ${{ secrets.YOLO_URL_PROD }}
