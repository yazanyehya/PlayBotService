name: Docker Scout Scan

on:
  pull_request:
    branches: [ main ]

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/polybot-image:pr-${{ github.event.number }}

      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/polybot-image:pr-${{ github.event.number }}
          only-severities: critical,high
          exit-code: 1
          sarif-file: scout-results.sarif
          write-comment: true

      - name: Upload Scout SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: scout-results.sarif
